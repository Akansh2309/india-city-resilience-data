name: Automated NASA Data Ingestion Pipeline

on:
  schedule:
    # Runs at 00:00 on the 1st of every month
    - cron: '0 0 1 * *'
  workflow_dispatch:
    # Allows manual triggering from the GitHub Actions UI

jobs:
  update-dataset:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run NASA Data Engineering Pipeline
      run: |
        # In a real automated scenario, you would pass an argument 
        # to the script to only fetch the latest month of data.
        python3 data_collection/fetch_nasa_data.py
        
    - name: Commit and Push Updates
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add india_resilience_data_nasa.csv
        # Only commit if there are changes
        git diff --quiet && git diff --staged --quiet || git commit -m "Automated update: Ingested latest NASA satellite data [skip ci]"
        git push
